# ==============================================================================
# Project Aria DINO-SAM2 Configuration
# ==============================================================================

dino_model_id: "IDEA-Research/grounding-dino-tiny"
box_threshold: 0.3
sam2_repo_id: "facebook/sam2-hiera-tiny"
sam2_checkpoint_name: "sam2_hiera_tiny.pt"
sam2_config: "configs/sam2/sam2_hiera_t.yaml"

# --- SAM 3.1 backend (RealSensePreprocess object/arm masks) ---
# Grounding-DINO + SAM2 remains the Aria `preprocess.Preprocess` default.
# RealSense sessions call SAM 3.1 via third_party/sam31_runtime (vendored, not a symlink).
sam31_threshold: 0.50            # instance score cutoff for SAM 3.1 text/video tracking
sam31_save_debug_video: true     # write debug mp4 under <session>/preprocess/.sam31_v2/

# --- Visual Prompts ---
dinosam_prompt:
  obj1: "a pretty cat ."
  arm: "human arms . human hands ."